<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A little surprise 🎁</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
    <script>
        /* Gate: before midnight on 23 Oct this page sends visitors back to the countdown.
           Add ?test to the URL (surprise.html?test) to open it early while you're building. */
        if (Date.now() < new Date("2026-10-23T00:00:00+05:30").getTime() &&
            !new URLSearchParams(location.search).has("test")) {
            location.replace("index.html");
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --warm-white: #FFF9F5;
            --peach-soft: #FFE6D8;
            --peach: #FFC3A5;
            --peach-deep: #F7977A;
            --ink: #6B4036;
            --gold: #FFD98E;
            --good: #FFE9A8;
            --peach-hover: #FFB596;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Quicksand", system-ui, sans-serif;
            font-weight: 600;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 8%, var(--peach-soft) 0, transparent 45%),
                radial-gradient(circle at 92% 88%, var(--peach-soft) 0, transparent 40%),
                var(--warm-white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .star {
            position: fixed;
            background: var(--gold);
            opacity: 0;
            animation: twinkle 3.4s ease-in-out infinite;
            pointer-events: none;
            clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15;
                transform: scale(.7);
            }

            50% {
                opacity: .95;
                transform: scale(1.15);
            }
        }

        .flower {
            position: fixed;
            pointer-events: none;
            opacity: .8;
        }

        .flower.f1 {
            width: 100px;
            top: -26px;
            right: -26px;
        }

        .flower.f2 {
            width: 90px;
            bottom: -30px;
            left: -24px;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 28px 18px 60px;
            text-align: center;
        }

        .back {
            display: inline-block;
            color: var(--ink);
            text-decoration: none;
            font-size: 14px;
            opacity: .8;
            margin-bottom: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        h1 {
            font-family: "Fredoka", sans-serif;
            font-weight: 600;
            font-size: clamp(28px, 7.5vw, 40px);
            line-height: 1.15;
            margin: 0 0 6px;
        }

        h2 {
            font-family: "Fredoka", sans-serif;
            font-weight: 500;
            font-size: clamp(20px, 5.5vw, 26px);
            line-height: 1.3;
            margin: 0 0 16px;
        }

        .sub {
            margin: 0 0 22px;
            font-size: 15px;
            opacity: .85;
        }

        button,
        .btn {
            font: inherit;
            font-family: "Fredoka", sans-serif;
            font-weight: 500;
            font-size: 16px;
            color: var(--ink);
            background: var(--peach);
            border: 0;
            border-radius: 999px;
            padding: 11px 22px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover,
        .btn:hover {
            background: var(--peach-hover);
        }

        button:focus-visible,
        .btn:focus-visible,
        .flip:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        /* chapter tabs */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 26px;
        }

        .tabs button {
            background: var(--white);
            border: 2px solid var(--peach-soft);
            padding: 9px 16px;
            font-size: 15px;
        }

        .tabs button[aria-selected="true"] {
            background: var(--peach);
            border-color: var(--peach);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .card {
            background: var(--white);
            border: 2px dashed var(--peach);
            border-radius: 20px;
            padding: 22px 18px;
        }

        /* quiz */
        .progress {
            margin: 0 0 8px;
            font-size: 14px;
            opacity: .8;
        }

        .opts {
            display: grid;
            gap: 10px;
            margin: 0 0 14px;
        }

        .opt {
            background: var(--warm-white);
            border: 2px solid var(--peach-soft);
            border-radius: 14px;
            padding: 12px 14px;
            text-align: left;
            font-family: "Quicksand", sans-serif;
            font-weight: 700;
        }

        .opt:hover:not(:disabled) {
            background: var(--peach-soft);
        }

        .opt.correct {
            background: var(--good);
            border-color: var(--gold);
        }

        .opt.picked {
            background: var(--peach-soft);
            border-color: var(--peach);
        }

        .opt.wrong {
            opacity: .65;
            text-decoration: line-through;
        }

        .opt:disabled {
            cursor: default;
            color: var(--ink);
        }

        .feedback {
            min-height: 1.6em;
            margin: 0 0 14px;
            line-height: 1.5;
        }

        .big {
            font-family: "Fredoka", sans-serif;
            font-size: 44px;
            margin: 6px 0;
        }

        /* envelopes */
        .envs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .env {
            background: var(--peach-soft);
            border: 2px solid var(--peach);
            border-radius: 16px;
            padding: 18px 10px 14px;
            font-family: "Quicksand", sans-serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.4;
        }

        .env .ic {
            display: block;
            font-size: 32px;
            margin-bottom: 6px;
        }

        .env.opened {
            background: var(--white);
            border-style: dashed;
        }

        dialog {
            border: 3px dashed var(--peach);
            border-radius: 22px;
            padding: 24px 22px;
            max-width: min(460px, 90vw);
            max-height: 85vh;
            overflow-y: auto;
            background: var(--white);
            color: var(--ink);
            text-align: left;
        }

        dialog::backdrop {
            background: rgba(107, 64, 54, .35);
        }

        dialog h3 {
            font-family: "Fredoka", sans-serif;
            font-weight: 500;
            margin: 0 0 10px;
            font-size: 20px;
        }

        dialog p {
            white-space: pre-line;
            line-height: 1.65;
            margin: 0 0 18px;
            font-size: 16px;
        }

        /* reason cards (flip) */
        .flipwrap {
            perspective: 900px;
            max-width: 360px;
            height: 240px;
            margin: 0 auto 18px;
        }

        .flip {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform .6s;
            transform-style: preserve-3d;
            border-radius: 22px;
        }

        .flip.flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            overflow-y: auto;
            padding: 20px;
            line-height: 1.6;
        }

        .front {
            background: var(--peach);
            font-family: "Fredoka", sans-serif;
            font-size: 24px;
        }

        .front small {
            font-family: "Quicksand", sans-serif;
            font-size: 13px;
            margin-top: 8px;
            opacity: .85;
        }

        .cardback {
            background: var(--white);
            border: 3px dashed var(--peach);
            transform: rotateY(180deg);
            font-size: 17px;
        }

        .cardnav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .count {
            font-size: 14px;
            opacity: .8;
            min-width: 56px;
        }

        /* last page */
        .closing {
            white-space: pre-line;
            line-height: 1.7;
            font-size: 17px;
            margin: 0 0 20px;
            text-align: left;
        }

        .spark {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            width: 12px;
            height: 12px;
            clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
        }

        @media (prefers-reduced-motion: reduce) {
            .star {
                animation: none;
                opacity: .5;
            }

            .flip {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="flower" viewBox="0 0 100 100">
            <g fill="#FFC9AE">
                <circle cx="50" cy="26" r="20" />
                <circle cx="74" cy="44" r="20" />
                <circle cx="65" cy="72" r="20" />
                <circle cx="35" cy="72" r="20" />
                <circle cx="26" cy="44" r="20" />
            </g>
            <circle cx="50" cy="52" r="13" fill="#FFE9A8" />
        </symbol>
    </svg>
    <svg class="flower f1" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#flower" />
    </svg>
    <svg class="flower f2" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#flower" />
    </svg>

    <main>
        <a class="back" href="index.html">← back to the first page</a>
        <h1>Psst, <span class="nick">Tiku</span>... 🌸</h1>
        <p class="sub">Pick a chapter. Take your time, there's no rush here.</p>

        <nav class="tabs" role="tablist" aria-label="Chapters">
            <button role="tab" id="tab-quiz" aria-controls="quiz" data-panel="quiz" aria-selected="true">📝
                Quiz</button>
            <button role="tab" id="tab-envelopes" aria-controls="envelopes" data-panel="envelopes"
                aria-selected="false">💌 Open when...</button>
            <button role="tab" id="tab-reasons" aria-controls="reasons" data-panel="reasons" aria-selected="false">🌱
                Flip-cards</button>
            <button role="tab" id="tab-last" aria-controls="last" data-panel="last" aria-selected="false">📖 Last
                page</button>
        </nav>

        <!-- Chapter 1: quiz -->
        <section id="quiz" class="panel active card" role="tabpanel" aria-labelledby="tab-quiz">
            <div id="quizBox"></div>
        </section>

        <!-- Chapter 2: open-when envelopes -->
        <section id="envelopes" class="panel" role="tabpanel" aria-labelledby="tab-envelopes">
            <p class="sub">Tap an envelope when the moment fits 💌</p>
            <div class="envs" id="envGrid"></div>
        </section>

        <!-- Chapter 3: flip cards -->
        <section id="reasons" class="panel" role="tabpanel" aria-labelledby="tab-reasons">
            <p class="sub">Tap the card to flip it ✨</p>
            <div class="flipwrap">
                <div class="flip" id="flip" role="button" tabindex="0" aria-pressed="false" aria-label="Flip the card">
                    <div class="face front"><span id="cardTitle"></span><small>tap to flip</small></div>
                    <div class="face cardback" id="cardText"></div>
                </div>
            </div>
            <div class="cardnav">
                <button id="prevCard" type="button" aria-label="Previous card">←</button>
                <span class="count" id="cardCount"></span>
                <button id="nextCard" type="button" aria-label="Next card">→</button>
            </div>
        </section>

        <!-- Chapter 4: last page -->
        <section id="last" class="panel card" role="tabpanel" aria-labelledby="tab-last">
            <h2>The last page 📖</h2>
            <p class="closing" id="closing"></p>
            <button id="finalConfetti" type="button">One last confetti 🎉</button>
        </section>
    </main>

    <dialog id="letter" aria-labelledby="letterTitle">
        <h3 id="letterTitle"></h3>
        <p id="letterText"></p>
        <button id="letterClose" type="button">Close 🌷</button>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
    <script>
        /* ================= EDIT THESE ================= */
        /* All the personal writing lives in this block. Replace each [ADD ...] placeholder with
           your own text. The code below this block does not need to change. */
        const NICKNAME = "Tiku"; // keep identical to the nickname in index.html

        // Chapter 1: quiz (roughly 3-5 questions works well)
        // answer = index of the right option (0 = first option).
        // answer = null means "no wrong answer": any pick is fine, the `right` text is shown
        // as feedback, and the question is not counted in the score. Good for hypotheticals.
        // Ideas: a preference/interest, a harmless shared joke, a playful hypothetical,
        // something interesting about her.
        const QUIZ = [
            {
                q: "Kot goi furi besi bhaal pua?",
                options: ["Beaches", "Mountains", "Deserts"],
                answer: 1,
                right: "Last time tatei goisila tu.",
                wrong: "Hosake ne?"
            },
            {
                q: "Name of your designing page.",
                options: ["Zymoyra", "Johonimora", "Joimaara"],
                answer: 0,
                right: "Logo tut je spelling mistake asile, monot aase?",
                wrong: "Ayo what!"
            },
            {
                q: "What will you do if I appear at your house suddenly, out of nowhere?",
                options: ["Assasinate by stabbing and dump my body", "Serve some tea, or maybe cook something", "Go back to your room and sleep"],
                answer: null,
                right: "Janisilue heitu choose koriba buli."
            },
            {
                q: "Let's say tumar usorot ₹1 lakh ahi jai, what will you do?",
                options: ["Gaming accessories kinim", "Korean fried chicken and dher kiba kibi khaba", "Baae khujileo nidia"],
                answer: null,
                right: "I trusted you to choose wisely."
            }
        ];
        // Shown at the end, based on the score (only scored questions count)
        const RESULTS = {
            low: "Is is ki je hobo nohoi...",
            mid: "Umm thike asei no...",
            high: "Kela jiki gol beh..."
        };

        // Chapter 2: 'open when' envelopes (2-4 short sentences each)
        // stressed = calm, gentle reassurance | laugh = playful, lighthearted
        // miss = warmth and company, with no expectation of a reply
        // doubt = grounded encouragement, without exaggerated praise
        const ENVELOPES = [
            { title: "Open when you're stressed", text: "I know you put a lot into the things that matter to you. I hope you remember that your worth isn't measured by how much you get done today. Do one thing at a time, okay?\n\nEven the GOAT can get stressed, cuz we aren't perfect, that's part of what makes us beautiful (tumi).🌷" },
            { title: "Open when you need a laugh", text: "Whatever happened today, remember that somewhere in this world a pigeon is walking around with the confidence of a CEO despite having absolutely no business plan. Be a little more pigeon.\n\nBhai moi joke nuwaru; ragebait ba insult boni jai, so korbar pora uthaisu...😂" },
            { title: "Open when you miss me", text: "Some conversations make an ordinary day a little less ordinary. I'm glad we've had some of those. Here's a small reminder of that, for whenever you feel like revisiting it.\n\nPise tumi janae, moi tu yatei asu 24*7 (actually 18*7), ready to listen to your yapping.🫶" },
            { title: "Open when you doubt yourself", text: "A difficult day is not a verdict on who you are. You can get something wrong, feel uncertain, or need more time without that erasing the things you do well. Be as patient with yourself as you would be with someone you care about.\n\nMoi nijoke kom koru niki, but tumi iman nokoriba ha.👀" },
            { title: "Open when something good happens", text: "Enjoy it. Cherish it. Live it. 🥳✨ Cuz you deserve good things too, isn't that right?\n\nNohole nakot tel di xui thaka." }
        ];

        // Chapter 3: flip cards. `title` is on the front, `text` is on the back. Add or remove cards freely.
        // Theme ideas, one per card: books/stories/ideas, her creative side, her humour or
        // conversation, a quality you admire, a wish for her next year.
        const CARDS = [
            { title: "📚 A World Between the Pages", text: "I like that you have a world of your own inside all those books and writings. There's something lovely about someone who keeps making room for new ideas and stories. Aru I see you as an inspiration for this ha—moio etiya besi books pohibo lagibo!📖" },
            { title: "🎨 Too Many Talents, Too Little Time", text: "I love how your interests aren't limited to one thing. Whether it's writing, cooking, or imagining a design, there's a creative side to you that I hope you always make time for. Pise tumi bonua dher kiba-kibi try koribo aase dei mur, khuaba ne?🍰" },
            { title: "😂 Our Highly Unprofessional Banter Department", text: "Our conversations would be suspiciously peaceful if we ever stopped roasting each other. I'm not saying you should stop. I'm just saying I reserve the right to file occasional complaints. Itue ituk fotua kotha paati jukai thakim haa gutei raati?🤖" },
            { title: "✨ A Collection of Random Moments", text: "You have contributed a frankly unreasonable number of memorable moments to my collection of random thoughts, jene...eh ase aru dher kiba-kibi. Hmm etu magic koi ne ki nejanu dei (I might be cooked fr).🌻" },
            { title: "🌷 A Year That Is Kind to You", text: "I hope this year brings you moments when you can be proud of yourself without immediately moving the goalpost. Bhalke khaba, furiba, furti koriba aru.🎉" }
        ];

        // Chapter 4: closing note. Look ahead to her year; don't repeat the main birthday message.
        const CLOSING = "Last 6 maah kotha paati bhalei lagile.. aaxa koru je enekei kotha pati thakim.... na na cut off koribo nelage, kotha tu bujisae no...\n\nPise bhaat khala? (eneo cake khabae) Bhalke pet khali hol ne?\n\nSo, the next 12 months are gonna be loaded ones! Dher kiba-kibi ahibo, aru bohut notun experience koriba. Aaxa koru je ei bosor tu tumar babe bhal memories, new experiences aru nijor upor proud feel koriboloi bohut moments loi ahe.🌷✨\n\nI'm glad to know you and I hope we can keep this connection for a long time. Wish I could have sent a special cake, but let's save that for the future! Happy birthday again, SilentRebel.exe! 🌸";
        /* ============================================== */

        const $ = id => document.getElementById(id);
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        document.querySelectorAll(".nick").forEach(n => n.textContent = NICKNAME);
        $("closing").textContent = CLOSING;
        if (new URLSearchParams(location.search).has("test")) document.querySelector(".back").href = "index.html?test=birthday";

        // background stars
        for (let i = 0; i < 20; i++) {
            const s = el("div", "star");
            const size = 6 + Math.random() * 9;
            s.style.cssText = `left:${Math.random() * 100}vw;top:${Math.random() * 100}vh;width:${size}px;height:${size}px;animation-delay:${(Math.random() * 3.4).toFixed(2)}s`;
            document.body.appendChild(s);
        }

        // confetti
        function burst() {
            if (!window.confetti || reduceMotion) return;
            const colors = ["#FFC3A5", "#F7977A", "#FFD98E", "#FFFFFF", "#FFE6D8"];
            confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 }, colors, shapes: ["star", "circle"] });
            setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors }), 250);
            setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors }), 250);
        }
        $("finalConfetti").addEventListener("click", burst);

        // tap sparkle
        document.addEventListener("pointerdown", e => {
            if (reduceMotion) return;
            const colors = ["#FFD98E", "#FFC3A5", "#F7977A", "#FFFFFF"];
            for (let i = 0; i < 8; i++) {
                const s = el("div", "spark");
                s.style.left = e.clientX - 6 + "px";
                s.style.top = e.clientY - 6 + "px";
                s.style.background = colors[i % colors.length];
                document.body.appendChild(s);
                const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
                const d = 40 + Math.random() * 40;
                s.animate(
                    [{ transform: "translate(0,0) scale(1)", opacity: 1 },
                    { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }],
                    { duration: 700, easing: "ease-out" }
                ).onfinish = () => s.remove();
            }
        });

        // chapter tabs (click, or arrow keys / Home / End once a tab is focused)
        const tabs = [...document.querySelectorAll(".tabs button")];
        function selectTab(t, focus) {
            tabs.forEach(x => {
                const on = x === t;
                x.setAttribute("aria-selected", on ? "true" : "false");
                x.tabIndex = on ? 0 : -1;
            });
            document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === t.dataset.panel));
            if (focus) t.focus();
        }
        tabs.forEach((t, i) => {
            t.addEventListener("click", () => {
                selectTab(t);
                window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
            });
            t.addEventListener("keydown", e => {
                const k = e.key;
                if (k !== "ArrowRight" && k !== "ArrowLeft" && k !== "Home" && k !== "End") return;
                e.preventDefault();
                const n = k === "Home" ? 0 : k === "End" ? tabs.length - 1
                    : (i + (k === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
                selectTab(tabs[n], true);
            });
        });
        selectTab(tabs[0]);

        // ---- Chapter 1: quiz ----
        const isScored = item => item.answer !== null && item.answer !== undefined;
        const scoredTotal = QUIZ.filter(isScored).length;
        let qi = 0, score = 0;
        function renderQuiz() {
            const box = $("quizBox");
            box.replaceChildren();

            if (qi >= QUIZ.length) {
                box.append(el("p", "progress", "All done!"));
                if (scoredTotal > 0) {
                    const ratio = score / scoredTotal;
                    box.append(
                        el("div", "big", `${score} / ${scoredTotal}`),
                        el("p", "feedback", ratio === 1 ? RESULTS.high : ratio >= 0.5 ? RESULTS.mid : RESULTS.low)
                    );
                    if (ratio === 1) setTimeout(burst, 300);
                } else {
                    box.append(el("div", "big", "🌸"));
                }
                const again = el("button", "", "Play again 🔁");
                again.addEventListener("click", () => { qi = 0; score = 0; renderQuiz(); });
                box.append(again);
                return;
            }

            const item = QUIZ[qi];
            const scored = isScored(item);
            const fb = el("p", "feedback");
            fb.setAttribute("aria-live", "polite");
            const next = el("button", "", qi + 1 < QUIZ.length ? "Next →" : "See my score ✨");
            next.hidden = true;
            next.addEventListener("click", () => { qi++; renderQuiz(); });

            const opts = el("div", "opts");
            const buttons = item.options.map((text, i) => {
                const b = el("button", "opt", text);
                b.addEventListener("click", () => {
                    buttons.forEach(x => x.disabled = true);
                    if (scored) {
                        buttons[item.answer].classList.add("correct");
                        if (i === item.answer) { score++; fb.textContent = item.right; }
                        else { b.classList.add("wrong"); fb.textContent = item.wrong; }
                    } else {
                        b.classList.add("picked");
                        fb.textContent = item.right;
                    }
                    next.hidden = false;
                    next.focus(); // keeps keyboard users in place after the options become disabled
                });
                return b;
            });
            buttons.forEach(b => opts.append(b));

            box.append(el("p", "progress", `Question ${qi + 1} of ${QUIZ.length}`), el("h2", "", item.q), opts, fb, next);
        }
        renderQuiz();

        // ---- Chapter 2: envelopes ----
        const letter = $("letter");
        ENVELOPES.forEach(item => {
            const b = el("button", "env");
            b.append(el("span", "ic", "💌"), document.createTextNode(item.title));
            b.addEventListener("click", () => {
                $("letterTitle").textContent = item.title;
                $("letterText").textContent = item.text;
                b.classList.add("opened");
                letter.showModal();
            });
            $("envGrid").append(b);
        });
        $("letterClose").addEventListener("click", () => letter.close());
        letter.addEventListener("click", e => { if (e.target === letter) letter.close(); });

        // ---- Chapter 3: flip cards ----
        let ci = 0;
        const flip = $("flip");
        function showCard() {
            $("cardTitle").textContent = CARDS[ci].title;
            $("cardText").textContent = CARDS[ci].text;
            $("cardCount").textContent = `${ci + 1} / ${CARDS.length}`;
        }
        function toggleFlip() {
            const on = flip.classList.toggle("flipped");
            flip.setAttribute("aria-pressed", on ? "true" : "false");
        }
        function goCard(step) {
            ci = (ci + step + CARDS.length) % CARDS.length;
            flip.classList.remove("flipped");
            flip.setAttribute("aria-pressed", "false");
            setTimeout(showCard, reduceMotion ? 0 : 280); // update after it flips back so the answer isn't revealed early
        }
        flip.addEventListener("click", toggleFlip);
        flip.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleFlip(); }
        });
        $("prevCard").addEventListener("click", () => goCard(-1));
        $("nextCard").addEventListener("click", () => goCard(1));
        showCard();
    </script>
</body>

</html>
